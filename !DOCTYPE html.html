<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 웹 페이지</title>
    <style>
        /* 웹 페이지를 간단하게 꾸며주는 스타일(CSS)입니다. */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #4A90E2;
        }
        button {
            background-color: #4A90E2;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>안녕하세요! 👋</h1>
        <p>AI가 만들어준 HTML 페이지에 오신 것을 환영합니다.</p>
        <p>아래 버튼을 한 번 눌러보세요!</p>
        
        <button onclick="alert('반가워요! 오늘 하루도 좋은 하루 보내세요! 🎉')">클릭해보세요</button>
    </div>

</body>
</html>
